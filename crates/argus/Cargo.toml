[package]
name = "argus"
version = "0.1.0"
edition.workspace = true

[dependencies]
futures = "0.3"
gpui = "0.2"
rustc-hash = "2"
gpui-component = "0.5"
argus-collector = { path = "../argus-collector" }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"
