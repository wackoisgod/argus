[package]
name = "tm-collector"
version = "0.1.0"
edition.workspace = true

[dependencies]
rayon = "1"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[[bin]]
name = "procdump"
path = "src/bin/procdump.rs"
