name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p argus
      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/argus.exe dist/
          Compress-Archive -Path dist/argus.exe -DestinationPath "argus-${{ github.ref_name }}-windows-x64.zip"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: argus-*-windows-x64.zip
          generate_release_notes: true
